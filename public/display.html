<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Security Awareness Demo</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #111827;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        header {

            padding: 25px;

            text-align: center;

            border-bottom:
                1px solid #374151;
        }


        header h1 {

            margin: 0;

            font-size: 28px;
        }


        header p {

            margin:
                8px 0 0;

            color: #9ca3af;
        }


        #gallery {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(250px, 1fr)
                );

            gap: 20px;

            padding: 25px;
        }


        .photo {

            background: #1f2937;

            border-radius: 10px;

            padding: 10px;

            overflow: hidden;
        }


        .photo img {

            width: 100%;

            display: block;

            border-radius: 7px;
        }


        .filename {

            padding:
                10px 5px 5px;

            color: #9ca3af;

            font-size: 12px;

            word-break: break-all;
        }


        .empty {

            text-align: center;

            color: #9ca3af;

            padding: 60px;

            font-size: 18px;
        }

    </style>

</head>


<body>


<header>

    <h1>
        Security Awareness Demo
    </h1>

    <p>
        Captured demonstration images
    </p>

</header>


<div id="gallery">

    <div class="empty">

        Waiting for captures...

    </div>

</div>


<script>


let previousImages = [];


// ==================================================
// LOAD IMAGES
// ==================================================

async function loadImages() {


    try {


        const response =
            await fetch(
                "/images"
            );


        const images =
            await response.json();


        // ------------------------------------------
        // Don't redraw if nothing changed
        // ------------------------------------------

        if (
            JSON.stringify(images) ===
            JSON.stringify(previousImages)
        ) {

            return;

        }


        previousImages =
            images;


        const gallery =
            document.getElementById(
                "gallery"
            );


        gallery.innerHTML = "";


        if (
            images.length === 0
        ) {


            gallery.innerHTML = `

                <div class="empty">

                    Waiting for captures...

                </div>

            `;


            return;

        }


        // ------------------------------------------
        // Display images
        // ------------------------------------------

        images.forEach(
            function (file) {


                const container =
                    document.createElement(
                        "div"
                    );


                container.className =
                    "photo";


                const image =
                    document.createElement(
                        "img"
                    );


                image.src =
                    "/captured/" +
                    encodeURIComponent(
                        file
                    );


                image.alt =
                    "Captured image";


                const filename =
                    document.createElement(
                        "div"
                    );


                filename.className =
                    "filename";


                filename.innerText =
                    file;


                container.appendChild(
                    image
                );


                container.appendChild(
                    filename
                );


                gallery.appendChild(
                    container
                );

            }
        );


    } catch (error) {


        console.error(
            "Could not load images:",
            error
        );

    }

}


// ==================================================
// CHECK EVERY 2 SECONDS
// ==================================================

setInterval(
    loadImages,
    2000
);


// Initial load

loadImages();

</script>


</body>

</html>
