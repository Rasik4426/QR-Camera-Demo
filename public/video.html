<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Captured Videos</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fa;margin:0;padding:30px;color:#111827}
h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px}
video{width:100%;border-radius:7px;background:#000}
.name{font-size:13px;color:#4b5563;margin-top:8px;word-break:break-all}
</style>
</head>
<body>
<h1>Captured Videos</h1>
<div id="videos">Loading...</div>
<script>
async function loadVideos(){
  const box=document.getElementById("videos");
  try{
    const files=await (await fetch("/videos")).json();
    if(!files.length){box.innerHTML="<p>No videos captured yet.</p>";return;}
    box.className="grid";
    box.innerHTML=files.map(f=>`<div class="card">
      <video controls playsinline src="/captured/${encodeURIComponent(f)}"></video>
      <div class="name">${f}</div>
    </div>`).join("");
  }catch(e){box.textContent="Unable to load videos.";}
}
loadVideos(); setInterval(loadVideos,2000);
</script>
</body>
</html>
